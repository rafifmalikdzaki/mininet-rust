[package]
name = "mininet-rust-py"
version = "0.1.0"
description = "Python bindings for the Rust mininet core (mnr) via PyO3"
edition.workspace = true
license.workspace = true

[lib]
name = "mininet_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
mn-net = { path = "../../crates/net" }
mn-topo = { path = "../../crates/topo" }
mn-util = { path = "../../crates/util" }
serde_json = "1"

[package.metadata.maturin]
name = "mininet_rust"
