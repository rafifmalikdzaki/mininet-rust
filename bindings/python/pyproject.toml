[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "mininet-rust"
version = "0.1.0"
description = "Python bindings for the Rust mininet core (mnr): build, run, and inspect emulated networks from Python"
requires-python = ">=3.9"
license = { text = "BSD-2-Clause" }

[tool.maturin]
features = ["pyo3/extension-module"]
