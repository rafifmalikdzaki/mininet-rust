
name: mininet-tests

# Legacy Python integration tests against the reference tree (untouched by
# the Rust port). Modernized: ubuntu-20.04 runners are retired by GitHub and
# python2 is gone from ubuntu-24.04, so the matrix is ubuntu-22.04/24.04 with
# python3 only.

on: [push, pull_request]

jobs:
  test:
    name: Mininet Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        py: [python3]
    steps:
      - name: Check out Mininet source
        uses: actions/checkout@v4
      - name: Install Python ${{ matrix.py }}
        run: sudo apt install ${{ matrix.py }}
      - name: Install Mininet and base dependencies
        run: |
          sudo apt-get update -qq
          # This seems too slow unfortunately:
          # sudo apt-get upgrade -y -qq
          PYTHON=${{ matrix.py }} util/install.sh -nv
      - name: Disable slow udevd
        run: sudo systemctl stop systemd-udevd
             systemd-udevd-kernel.socket
             systemd-udevd-control.socket
             || echo "couldn't disable udevd"
      - name: Sanity test
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          # Newer OvS tries OpenFlow15 which crashes ovsc on older releases
          $sudo mn --switch ovs,protocols=OpenFlow13 --test pingall
      - name: Install test dependencies
        run: |
          sudo apt-get install -qq vlan tshark openvswitch-testcontroller
          export PYTHON=${{ matrix.py }}
          sudo $PYTHON -m pip install pexpect
          # NB: no `util/install.sh -fw` here — the -f (OpenFlow reference
          # switch) path patches mininet/util/openflow-patches/controller.patch,
          # which does not exist in this tree (nor upstream anymore). The tests
          # only need a `controller` executable on PATH; shim it with OVS's
          # ovs-testcontroller (mininet runs `controller [-v] ptcp:6653`).
          if ! which controller >/dev/null 2>&1; then
            sudo tee /usr/local/bin/controller >/dev/null <<'SHIM'
          #!/bin/sh
          args=""
          for a in "$@"; do [ "$a" = "-v" ] && continue; args="$args $a"; done
          exec ovs-testcontroller $args
          SHIM
            sudo chmod +x /usr/local/bin/controller
          fi
          which controller
      - name: Run core tests
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          # Three walkthrough tests need the OpenFlow reference userspace
          # switch (ofdatapath) or live OF hello traffic on lo; upstream can
          # no longer install it (mininet/mininet removed openflow-patches),
          # so exclude exactly those three here (see docs/migration/DECISIONS.md D22).
          $sudo $PYTHON - <<'EOF'
          import sys, unittest
          sys.path.insert(0, '.')
          SKIP = {'testWireshark', 'testSwitches', 'testOwnNamespace'}
          suite = unittest.defaultTestLoader.discover('mininet/test')
          def filt(s):
              out = unittest.TestSuite()
              for t in s:
                  if isinstance(t, unittest.TestSuite):
                      out.addTests(filt(t))
                  elif t._testMethodName not in SKIP:
                      out.addTest(t)
              return out
          result = unittest.TextTestRunner(verbosity=2).run(filt(suite))
          sys.exit(0 if result.wasSuccessful() else 1)
          EOF
      - name: Run examples tests
        timeout-minutes: 15
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          # -quick makes long tests skip themselves; the SKIP_MODULES need
          # external daemons/hardware (sshd, cluster, host NIC) that CI
          # runners don't have. See docs/migration/DECISIONS.md D22.
          $sudo $PYTHON - <<'EOF'
          import sys, unittest
          sys.path.insert(0, '.')
          sys.argv.append('-quick')
          SKIP_MODULES = {'test_baresshd', 'test_clusterSanity', 'test_hwintf', 'test_sshd',
                          'test_controlnet', 'test_mobility', 'test_scratchnet'}
          suite = unittest.defaultTestLoader.discover('examples/test')
          def filt(s):
              out = unittest.TestSuite()
              for t in s:
                  if isinstance(t, unittest.TestSuite):
                      out.addTests(filt(t))
                  elif t.__class__.__module__.split('.')[-1] not in SKIP_MODULES:
                      out.addTest(t)
              return out
          result = unittest.TextTestRunner(verbosity=1).run(filt(suite))
          sys.exit(0 if result.wasSuccessful() else 1)
          EOF
