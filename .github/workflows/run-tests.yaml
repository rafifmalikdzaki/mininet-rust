
name: mininet-tests

# Legacy Python integration tests against the reference tree (untouched by
# the Rust port). Modernized: ubuntu-20.04 runners are retired by GitHub and
# python2 is gone from ubuntu-24.04, so the matrix is ubuntu-22.04/24.04 with
# python3 only.

on: [push, pull_request]

jobs:
  test:
    name: Mininet Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        py: [python3]
    steps:
      - name: Check out Mininet source
        uses: actions/checkout@v4
      - name: Install Python ${{ matrix.py }}
        run: sudo apt install ${{ matrix.py }}
      - name: Install Mininet and base dependencies
        run: |
          sudo apt-get update -qq
          # This seems too slow unfortunately:
          # sudo apt-get upgrade -y -qq
          PYTHON=${{ matrix.py }} util/install.sh -nv
      - name: Disable slow udevd
        run: sudo systemctl stop systemd-udevd
             systemd-udevd-kernel.socket
             systemd-udevd-control.socket
             || echo "couldn't disable udevd"
      - name: Sanity test
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          # Newer OvS tries OpenFlow15 which crashes ovsc on older releases
          $sudo mn --switch ovs,protocols=OpenFlow13 --test pingall
      - name: Install test dependencies
        run: |
          sudo apt-get install -qq vlan tshark openvswitch-testcontroller
          export PYTHON=${{ matrix.py }}
          sudo $PYTHON -m pip install pexpect
          # NB: no `util/install.sh -fw` here — the -f (OpenFlow reference
          # switch) path patches mininet/util/openflow-patches/controller.patch,
          # which does not exist in this tree (nor upstream anymore). The tests
          # only need a `controller` executable on PATH; shim it with OVS's
          # ovs-testcontroller (mininet runs `controller [-v] ptcp:6653`).
          if ! which controller >/dev/null 2>&1; then
            sudo tee /usr/local/bin/controller >/dev/null <<'SHIM'
          #!/bin/sh
          args=""
          for a in "$@"; do [ "$a" = "-v" ] && continue; args="$args $a"; done
          exec ovs-testcontroller $args
          SHIM
            sudo chmod +x /usr/local/bin/controller
          fi
          which controller
      - name: Run core tests
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          $sudo $PYTHON mininet/test/runner.py -v
      - name: Run examples tests
        run: |
          export sudo="sudo env PATH=$PATH"
          export PYTHON=${{ matrix.py }}
          $sudo $PYTHON examples/test/runner.py -v
