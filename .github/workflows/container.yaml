name: container-image

# Smoke-test the rootless-container path (container/Dockerfile +
# scripts/mnr-container.sh): build the mnr image and run a real emulated
# topology inside it. On GH runners `docker` is usable without sudo, so the
# wrapper's docker fallback is exercised here; end users run the same wrapper
# with rootless podman/docker on their own host (no root/sudo needed there).

on:
  push:
    branches: [rust-migration, master]
  pull_request:

permissions:
  contents: read

jobs:
  rootless-image:
    name: mnr container image (build + emulated pingall)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the mnr-rootless image
        run: docker build -t mnr-rootless:ci -f container/Dockerfile .

      # The wrapper auto-adds --switch lxbr (no OVS kernel module in the
      # container); it mounts $PWD at /w and passes all args to mnr.
      - name: mnr in container — single,3 pingall
        run: MNR_IMAGE=mnr-rootless:ci MNR_RUNTIME=docker sh scripts/mnr-container.sh --topo single,3 --test pingall

      - name: mnr in container — linear,4 pingall
        run: MNR_IMAGE=mnr-rootless:ci MNR_RUNTIME=docker sh scripts/mnr-container.sh --topo linear,4 --test pingall

      - name: mnr in container — dump (dry-run plan, no emulation)
        run: MNR_IMAGE=mnr-rootless:ci MNR_RUNTIME=docker sh scripts/mnr-container.sh --topo tree,2,2 --dump
