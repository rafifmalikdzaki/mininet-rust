name: rust-root-tests

# Task 12 (CI part) of tasks/plan.md: the privileged CI job for the root-gated
# suites. Complements rust-ci.yaml (unprivileged: fmt/check/clippy/test/release
# build). This job runs in a privileged container (root + CAP_NET_ADMIN +
# netns), per docs/migration/TESTING.md section 2.4 (Option A).

on:
  push:
    branches: [rust-migration, master]
  pull_request:

permissions:
  contents: read

jobs:
  root-tests:
    name: Root-gated tests + Python-vs-Rust diff (privileged container)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NB: `allow-failure` is only valid inside strategy.matrix, not at job
    # level — an invalid key makes GitHub reject the whole workflow file and
    # the run fails in 0s with zero jobs. (continue-on-error is the job-level
    # key; false is the default, so it is simply omitted.)
    container:
      image: ubuntu:24.04
      options: --privileged   # netns + CAP_NET_ADMIN; container jobs run as root
    env:
      # scripts/diff_topology.sh drives the Python reference side
      # (mininet/*.py, untouched) via an embedded python3 driver; the harness
      # sets PYTHONPATH itself, but export it here too so the Python modules
      # resolve from the repo root (checkout dir = GITHUB_WORKSPACE).
      PYTHONPATH: .:legacy
    steps:
      - uses: actions/checkout@v4

      # Host deps for BOTH sides, installed FIRST: the bare ubuntu:24.04
      # container has no curl/ca-certificates, which dtolnay/rust-toolchain
      # needs to fetch rustup. apt only — nothing is pip-installed.
      # Python reference side needs: python3 + python3-packaging (mininet
      # util.py prefers packaging.version; 24.04's python3.12 has no
      # distutils), ip (iproute2), ifconfig (net-tools), mnexec (built below
      # from mnexec.c), ovs-vsctl (openvswitch-switch, default switch class
      # OVSSwitch), brctl (bridge-utils), ethtool (link status), iptables
      # (NAT tests). Rust side needs cargo only (plus iptables for the NAT
      # root test).
      - name: Install host dependencies (apt only, no pip)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl \
            python3 python3-packaging iproute2 net-tools bridge-utils \
            ethtool iptables iputils-ping openvswitch-switch \
            openvswitch-testcontroller gcc make libc6-dev
          python3 --version

      # mininet runs `controller [-v] ptcp:6653` for the default controller;
      # shim it with OVS's ovs-testcontroller (the OpenFlow reference-switch
      # patch path does not exist in this tree). Same shim as run-tests.yaml.
      - name: Shim `controller` with ovs-testcontroller
        run: |
          if ! which controller >/dev/null 2>&1; then
            tee /usr/local/bin/controller >/dev/null <<'SHIM'
          #!/bin/sh
          args=""
          for a in "$@"; do [ "$a" = "-v" ] && continue; args="$args $a"; done
          exec ovs-testcontroller $args
          SHIM
            chmod +x /usr/local/bin/controller
          fi
          which controller

      # The cgroup-v2 host test writes cpu.max under /sys/fs/cgroup; make
      # sure the cgroup2 mount is writable in this privileged container.
      - name: Ensure writable cgroup2 mount
        run: |
          mount -t cgroup2 none /sys/fs/cgroup 2>/dev/null \
            || mount -o remount,rw /sys/fs/cgroup 2>/dev/null \
            || true
          touch /sys/fs/cgroup/.rw-probe 2>/dev/null && rm -f /sys/fs/cgroup/.rw-probe \
            && echo "cgroup2 writable" || echo "cgroup2 NOT writable (cgroup test may skip/fail)"

      - uses: dtolnay/rust-toolchain@stable
        # rust-toolchain.toml pins channel = "stable"; Cargo.lock is committed.

      # Python mininet pathCheck()s 'mnexec' and 'ifconfig' at Host setup;
      # build the C helper from the repo and put it on PATH. Compiled directly
      # (not via `make mnexec`) because the Makefile derives -DVERSION from
      # `bin/mn --version`, which fails on the container's python3.12
      # (mininet imports distutils, removed in 3.12).
      - name: Build mnexec and install it on PATH
        run: |
          cc -O2 -Wall -DVERSION='"2.3.1b4"' legacy/mnexec.c -o mnexec
          install -D mnexec /usr/local/bin/mnexec
          which mnexec && mnexec 2>&1 | head -n 1 || true

      # No systemd inside the container: create the OVS db by hand (the deb
      # postinst normally does this) and start the daemons manually so
      # ovs-vsctl (OVSSwitch default) works.
      - name: Start Open vSwitch daemons (container has no systemd)
        run: |
          # The container shares the host kernel; make sure the OVS kernel
          # datapath module is loaded, otherwise OVS ports blackhole packets
          # and pingall hangs (no ping deadline by default, like Python).
          modprobe openvswitch 2>/dev/null || true
          grep -c '^openvswitch' /proc/modules || echo "WARNING: openvswitch module not loaded"
          mkdir -p /etc/openvswitch /var/run/openvswitch /var/log/openvswitch
          if [ ! -f /etc/openvswitch/conf.db ]; then
            ovsdb-tool create /etc/openvswitch/conf.db \
              /usr/share/openvswitch/vswitch.ovsschema
          fi
          if ! ovs-vsctl show >/dev/null 2>&1; then
            ovsdb-server --remote=punix:/var/run/openvswitch/db.sock \
              --pidfile=/var/run/openvswitch/ovsdb-server.pid --detach \
              --log-file=/var/log/openvswitch/ovsdb-server.log
            ovs-vswitchd --pidfile=/var/run/openvswitch/ovs-vswitchd.pid --detach \
              --log-file=/var/log/openvswitch/ovs-vswitchd.log
          fi
          ovs-vsctl show

      # Release build first: scripts/diff_topology.sh prefers
      # target/release/mnr as the Rust side of the differential harness.
      - name: Build the workspace (release)
        run: cargo build --workspace --release

      # 1. Root-gated netlink/netns integration tests (#[ignore] + env gate,
      #    serialized because some tests fork children that change namespaces).
      - name: Root-gated cargo tests (MN_RUST_ROOT_TESTS=1)
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: 1
        run: MN_RUST_ROOT_TESTS=1 cargo test --workspace -- --ignored --test-threads=1

      # 2. One-shot root suite: re-runs the root-gated cargo tests and then
      #    scripts/diff_topology.sh across the increasing-complexity ladder
      #    (single,3 ... tree,3,3), diffing the normalized Python reference
      #    dump vs the Rust `mnr --dump` output (MATCH/MISMATCH per spec).
      #    Exits non-zero on any failure. lxbr: this container has no OVS
      #    kernel datapath module, so use the kernel LinuxBridge on both
      #    sides (OVS itself is covered by the VM workflows).
      - name: Full root suite + differential topology harness
        timeout-minutes: 25
        env:
          DIFF_MN_SWITCH: lxbr
        run: sh scripts/run_root_tests.sh

      # 3. Differential benchmark ladder: Python bin/mn vs Rust mnr on the
      #    same scenario ladder; markdown table uploaded as an artifact.
      - name: Benchmark scenarios (python mn vs rust mnr)
        timeout-minutes: 20
        env:
          BENCH_SWITCH: lxbr
        run: sh scripts/bench_scenarios.sh > bench-results.md
      - name: Upload benchmark table
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.md
