[workspace]
resolver = "2"
members = ["crates/util", "crates/topo", "crates/netlink", "crates/link", "crates/node", "crates/net", "crates/tui", "crates/mcp", "apps/mn", "apps/mnexec", "apps/mn-tui", "apps/mn-mcp", "bindings/python"]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/mininet/mininet"

[workspace.dependencies]
# Kernel-facing netlink stack (containerlab lesson: talk netlink, never shell out)
rtnetlink = "0.24"
netlink-packet-route = "0.34"
netlink-packet-core = "0.9"
# syscall wrappers (unshare/setns/mount/exec) for mnexec
nix = { version = "0.31", features = ["sched", "mount", "fs", "process"] }
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"

[profile.release]
opt-level = 3
