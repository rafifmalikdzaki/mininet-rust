[package]
name = "mn-tui-app"
version = "0.1.0"
description = "mn-tui binary: OMO-style live graph TUI for the emulated network"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mn-tui"
path = "src/main.rs"

[dependencies]
mn-tui = { path = "../../crates/tui" }
mn-net = { path = "../../crates/net" }
mn-topo = { path = "../../crates/topo" }
mn-util = { path = "../../crates/util" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde_json = "1"
