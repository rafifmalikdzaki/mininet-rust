[package]
name = "mnr-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server core for mininet-rust: JSON-RPC 2.0 over stdio framing, tool registry, and a session holding an optional mn-net Mininet (task 14)"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mn-net = { path = "../net" }
mn-topo = { path = "../topo" }
mnr-tui = { path = "../tui" }
mn-util = { path = "../util" }
