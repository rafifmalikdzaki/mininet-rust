[package]
name = "mn-link"
version = "0.1.0"
description = "Link model ported from mininet/link.py (Intf, Link, TCLink, TCULink) on top of mn-netlink: veth pairs/addresses via rtnetlink, netem qdiscs via netlink-packet-route TrafficControl"
edition.workspace = true
license.workspace = true

[dependencies]
mn-util = { path = "../util" }
mn-netlink = { path = "../netlink" }
rtnetlink.workspace = true
netlink-packet-route.workspace = true
netlink-packet-core.workspace = true
tokio.workspace = true
futures.workspace = true

[dev-dependencies]
# Only used by the root-gated integration tests (fork/setns holders), same
# pattern as crates/netlink.
nix.workspace = true
libc.workspace = true
