[package]
name = "mn-tui"
version = "0.1.0"
description = "Terminal-free graph model + layered layout + cell-buffer renderer for the emulated network (OMO-style live graph TUI core; used by the mn-tui binary and later the MCP server)"
edition.workspace = true
license.workspace = true

[dependencies]
mn-net = { path = "../net" }
mn-topo = { path = "../topo" }
mn-link = { path = "../link" }
mn-util = { path = "../util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
